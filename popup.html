<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      width: 260px;
      padding: 16px;
      margin: 0;
      background: #fff;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 4px;
      color: #111;
    }
    p {
      font-size: 11px;
      color: #666;
      margin: 0 0 14px;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 9px 0;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #b91c1c; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <h2>Clean Demo</h2>
  <p>vendorOnboarding.assessmentSummary.trust</p>
  <button id="btn">Delete from localStorage</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
